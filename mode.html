<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>darkmode limi counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a onclick="rumahKu()" href="index.html">HOME</a>
            <a onclick="darkMode()" id="mode">MODE</a>
            <a onclick="restart()" id="reset">RESET</a>
        </nav>
            <h1>belajar coding web sesi4</h1>
            <p class="info" id="info"></p>
    </div>

    <!-- initializing function script -->
    <script>
      let body = document.body;
      let info = document.getElementById("info");
      let mode = document.getElementById("mode");
      let home = document.getElementById("home");
      let reset = document.getElementById("reset");
      
      const darkLimit = 5;
      let darkCounter = 0;
      let darkRemainingLeft

        function darkMode() {
            if(darkRemainingLeft == 1){
                info.textContent = "FITUR DARK MODE ANDA TELAH MENCAPAI LIMIT"
                mode.style.display = "none";
                reset.textContent = "RESTART";
                return;
            }
            
            darkCounter += 1;
            darkRemainingLeft = darkLimit - darkCounter;

            //  ronder ke info element 
            info.textContent = `Darkmode dipakai ${darkCounter}x, tersisa ${darkRemainingLeft}`

            body.classList.toggle("dark");
        }



        function restart(){
            location.reload();
        }
    </script>
  </body>
</html>
